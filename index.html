  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makePuzzle(rng, minSteps, plus) {
  for (var tries = 0; tries < 300; tries++) {
    var src = WORDS[Math.floor(rng() * WORDS.length)];
    var d = minSteps;
    if (plus) d = minSteps + Math.floor(rng() * 4);
    var cands = wordsAt(src, d);
    if (!cands.length) continue;
    var dst = cands[Math.floor(rng() * cands.length)];
    if (bfsDist(src, dst) !== d) continue;
    return { start: src, end: dst, min: d };
  }
  return { start: "cold", end: "warm", min: 3 };
}

/* ================= 存档 ================= */
function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var stats = load("wl_stats", { streak: 0, best: 0, solved: 0 });
var muted = load("wl_muted", false);

/* ================= 音效 ================= */
var actx = null;
function beep(freq, dur, type, gainv) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(gainv || 0.1, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

/* ================= SDK 事件 ================= */
function sdkStart() { try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStart(); } catch (e) {} }
function sdkStop() { try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStop(); } catch (e) {} }

/* ================= 界面状态 ================= */
var G = null; // 当前对局
function show(id) {
  var ss = document.querySelectorAll(".screen");
  for (var i = 0; i < ss.length; i++) ss[i].classList.remove("on");
  document.getElementById(id).classList.add("on");
}
function fmtStats() {
  document.getElementById("mStreak").textContent = stats.streak;
  document.getElementById("mBest").textContent = stats.best;
  document.getElementById("mSolved").textContent = stats.solved;
}
function todayKey() {
  var d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function startSession(mode, diff) {
  var daily = mode === "daily";
  var seedBase = daily ? todayKey() : (Date.now() & 0x7fffffff);
  var puzzles = [];
  for (var i = 0; i < 3; i++) {
    var d = daily ? [3, 4, 5][i] : diff;
    puzzles.push(makePuzzle(mulberry32(seedBase + i * 7919 + (daily ? 0 : Math.floor(Math.random() * 1e6))), d, d >= 5));
  }
  G = { mode: mode, diff: diff, puzzles: puzzles, idx: 0, path: [], solvedAll: 0, perfects: 0 };
  document.getElementById("gMode").textContent = daily ? "Daily Challenge" : "Endless";
  sdkStart();
  loadPuzzle();
  show("scGame");
}
function loadPuzzle() {
  var pz = G.puzzles[G.idx];
  G.path = [pz.start];
  G.hintUsed = false;
  document.getElementById("gTitle").textContent = G.mode === "daily" ? "PUZZLE " + (G.idx + 1) + "/3" : "ENDLESS";
  document.getElementById("hintbox").style.display = "none";
  document.getElementById("msg").textContent = "Tap a letter of your current word to change it";
  document.getElementById("ovl").classList.remove("on");
  renderLadder();
  updSteps();
}
function curWord() { return G.path[G.path.length - 1]; }
function updSteps() {
  var pz = G.puzzles[G.idx];
  document.getElementById("gSteps").textContent = "Moves: " + (G.path.length - 1) + " · Par: " + pz.min;
}
function renderLadder() {
  var pz = G.puzzles[G.idx];
  var el = document.getElementById("ladder");
  var html = "";
  for (var i = 0; i < G.path.length; i++) {
    var w = G.path[i];
    var cls = "card";
    if (i === 0) cls += " start";
    if (i === G.path.length - 1 && w !== pz.end) cls += " cur";
    if (w === pz.end) cls += " done target";
    var cells = "";
    for (var p = 0; p < 4; p++) {
      if (i === G.path.length - 1 && w !== pz.end) cells += '<span class="pos" data-p="' + p + '">' + w.charAt(p) + "</span>";
      else cells += "<span>" + w.charAt(p) + "</span>";
    }
    html += '<div class="rung"><div class="stepno">' + (i === 0 ? "·" : i) + "</div>" +
      (i > 0 ? '<div class="arrow">&#8594;</div>' : '<div class="arrow"></div>') +
      '<div class="' + cls + '">' + cells + "</div></div>";
  }
  html += '<div class="rung"><div class="stepno">?</div><div class="arrow">&#8594;</div>' +
    '<div class="card" style="opacity:.55">' +
    '<span style="color:#a09272">.</span><span style="color:#a09272">.</span><span style="color:#a09272">.</span><span style="color:#a09272">.</span></div></div>' +
    '<div class="rung"><div class="stepno">&#9733;</div><div class="arrow">&#8594;</div><div class="card target">' +
    pz.end.split("").map(function (c) { return "<span>" + c + "</span>"; }).join("") + "</div></div>";
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
  var ps = el.querySelectorAll(".pos");
  for (var k = 0; k < ps.length; k++) {
    ps[k].addEventListener("click", onPosTap);
    ps[k].addEventListener("touchstart", function (e) { e.preventDefault(); onPosTap.call(this, e); }, { passive: false });
  }
}
function onPosTap(e) {
  if (!G) return;
  var p = parseInt(this.getAttribute("data-p"), 10);
  var w = curWord();
  var letters = adjs[w][p] || "";
  var kbd = document.getElementById("kbd");
  if (!letters) {
    kbd.style.display = "none";
    document.getElementById("msg").textContent = "No letter fits there right now";
    beep(160, 0.12, "sawtooth", 0.06);
    return;
  }
  var html = "";
  for (var i = 0; i < letters.length; i++) html += '<button class="kt" data-p="' + p + '" data-l="' + letters.charAt(i) + '">' + letters.charAt(i).toUpperCase() + "</button>";
  html += '<div class="x">pick a letter for position ' + (p + 1) + " &middot; tap again to close</div>";
  kbd.innerHTML = html;
  kbd.style.display = "flex";
  var bs = kbd.querySelectorAll(".kt");
  for (var j = 0; j < bs.length; j++) {
    bs[j].addEventListener("click", onLetterPick);
    bs[j].addEventListener("touchstart", function (ev) { ev.preventDefault(); onLetterPick.call(this, ev); }, { passive: false });
  }
  beep(520, 0.05, "sine", 0.05);
}
function onLetterPick() {
  var p = this.getAttribute("data-p"), l = this.getAttribute("data-l");
  var w = curWord();
  var nw = w.slice(0, +p) + l + w.slice(+p + 1);
  document.getElementById("kbd").style.display = "none";
  if (!WSET[nw]) { document.getElementById("msg").textContent = "Not a word"; return; }
  if (G.path.indexOf(nw) !== -1) { document.getElementById("msg").textContent = "Already used"; beep(160, 0.12, "sawtooth", 0.06); return; }
  G.path.push(nw);
  document.getElementById("msg").textContent = "";
  beep(380 + G.path.length * 40, 0.09, "triangle", 0.09);
  updSteps(); renderLadder();
  if (nw === G.puzzles[G.idx].end) winPuzzle();
}
function winPuzzle() {
  var pz = G.puzzles[G.idx];
  var moves = G.path.length - 1;
  var perfect = moves <= pz.min && !G.hintUsed;
  G.solvedAll++; stats.solved++;
  if (perfect) G.perfects++;
  var title = document.getElementById("pTitle");
  var big = document.getElementById("pBig");
  var txt = document.getElementById("pText");
  if (perfect) { title.textContent = "Ladder Complete!"; big.textContent = "PERFECT ×2"; txt.textContent = moves + " moves — matched the shortest path. Double score!"; }
  else { title.textContent = "Ladder Complete!"; big.textContent = moves + " moves"; txt.textContent = "Shortest path was " + pz.min + ". Try to match it next time."; }
  document.getElementById("pNext").textContent = (G.mode === "daily" && G.idx === 2) ? "See Summary" : "Next Puzzle";
  document.getElementById("ovl").classList.add("on");
  beep(660, 0.12, "sine", 0.1); setTimeout(function () { beep(880, 0.18, "sine", 0.1); }, 120);
  if (G.mode === "daily" && G.idx === 2) {
    stats.streak++; if (stats.streak > stats.best) stats.best = stats.streak;
  } else if (G.mode === "endless") {
    stats.streak++; if (stats.streak > stats.best) stats.best = stats.streak;
  }
  save("wl_stats", stats);
  try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.happytime(); } catch (e) {}
}
function summary() {
  var title = document.getElementById("pTitle");
  var big = document.getElementById("pBig");
  var txt = document.getElementById("pText");
  title.textContent = "Daily Complete!";
  big.textContent = G.solvedAll + "/3";
  txt.textContent = G.perfects + " perfect · streak " + stats.streak + " (best " + stats.best + ")";
  document.getElementById("pNext").textContent = "Main Menu";
  document.getElementById("ovl").classList.add("on");
}
function nextStep() {
  if (G.mode === "daily" && G.idx < 2) { G.idx++; loadPuzzle(); }
  else if (G.mode === "endless") { G.idx++; G.puzzles[G.idx] = makePuzzle(mulberry32((Date.now() ^ (G.idx * 2654435761)) & 0x7fffffff), G.diff, G.diff >= 5); loadPuzzle(); }
  else quitToMenu(true);
}
function quitToMenu(done) {
  sdkStop();
  if (!done && G && G.path.length > 1 && G.mode !== "daily") { stats.streak = 0; save("wl_stats", stats); }
  G = null;
  fmtStats(); show("scMenu");
  document.getElementById("ovl").classList.remove("on");
  document.getElementById("kbd").style.display = "none";
}
function doHint() {
  if (!G) return;
  var pz = G.puzzles[G.idx], w = curWord();
  if (w === pz.end) return;
  G.hintUsed = true;
  var d = bfsDist(w, pz.end);
  var hb = document.getElementById("hintbox");
  var ns = neighbors(w);
  var good = null;
  for (var i = 0; i < ns.length; i++) {
    if (bfsDist(ns[i], pz.end) === d - 1) { good = ns[i]; break; }
  }
  var masked = "????";
  if (good) {
    // 遮住一个仍需修改的字母位
    var diffs = [];
    for (var p = 0; p < 4; p++) if (good.charAt(p) !== pz.end.charAt(p)) diffs.push(p);
    var hide = diffs.length ? diffs[Math.floor(Math.random() * diffs.length)] : 0;
    masked = good.split("").map(function (c, idx) { return idx === hide ? "•" : c; }).join("");
  }
  hb.textContent = "Shortest path from here: " + d + (d === 1 ? " step" : " steps") + " · one good next word: " + masked;
  hb.style.display = "block";
  beep(440, 0.1, "sine", 0.07);
}
function doUndo() {
  if (!G || G.path.length <= 1) return;
  G.path.pop();
  document.getElementById("msg").textContent = "";
  updSteps(); renderLadder();
  beep(300, 0.08, "square", 0.05);
}
function toggleMute() {
  muted = !muted; save("wl_muted", muted);
  document.getElementById("bMute").textContent = muted ? "Sound: Off" : "Sound: On";
}

/* ================= 输入绑定 ================= */
function bindTap(id, fn) {
  var el = document.getElementById(id);
  el.addEventListener("click", fn);
  el.addEventListener("touchstart", function (e) { e.preventDefault(); fn.call(el, e); }, { passive: false });
}
bindTap("bDaily", function () { startSession("daily", 0); });
bindTap("bEndless", function () { startSession("endless", 4); });
var diffs = document.querySelectorAll("[data-diff]");
for (var di = 0; di < diffs.length; di++) (function (b) {
  b.addEventListener("click", function () { startSession("endless", parseInt(b.getAttribute("data-diff"), 10)); });
  b.addEventListener("touchstart", function (e) { e.preventDefault(); startSession("endless", parseInt(b.getAttribute("data-diff"), 10)); }, { passive: false });
})(diffs[di]);
bindTap("bQuit", function () { quitToMenu(false); });
bindTap("bMute", toggleMute);
bindTap("bUndo", doUndo);
bindTap("bHint", doHint);
bindTap("pNext", function () {
  if (this.textContent === "Main Menu") quitToMenu(true);
  else if (this.textContent === "See Summary") summary();
  else nextStep();
});
bindTap("pMenu", function () { quitToMenu(true); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && G) { quitToMenu(false); return; }
  if (!G || document.getElementById("ovl").classList.contains("on")) return;
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { doUndo(); return; }
  if (e.key === "Backspace") { doUndo(); e.preventDefault(); return; }
  if (e.key === "h" || e.key === "H") { doHint(); return; }
  // 桌面键盘直接输入整词
  if (/^[a-zA-Z]$/.test(e.key)) {
    var ti = document.getElementById("typeIn");
    ti.focus();
  }
});
document.getElementById("typeIn").addEventListener("input", function () {
  var v = this.value.toLowerCase();
  this.value = "";
  if (!G || v.length !== 4 || !WSET[v]) return;
  var w = curWord(), diffPos = -1, n = 0;
  for (var p = 0; p < 4; p++) if (v.charAt(p) !== w.charAt(p)) { n++; diffPos = p; }
  if (n !== 1) { document.getElementById("msg").textContent = "Change exactly one letter"; return; }
  if (G.path.indexOf(v) !== -1) { document.getElementById("msg").textContent = "Already used"; return; }
  G.path.push(v);
  beep(380 + G.path.length * 40, 0.09, "triangle", 0.09);
  updSteps(); renderLadder();
  if (v === G.puzzles[G.idx].end) winPuzzle();
});
// 阻止页面滚动橡皮筋（键盘弹层除外）
document.body.addEventListener("touchmove", function (e) {
  if (!e.target.closest || !e.target.closest("#ladder")) e.preventDefault();
}, { passive: false });

/* ================= 启动 ================= */
document.getElementById("bMute").textContent = muted ? "Sound: Off" : "Sound: On";
var dk = todayKey();
if (load("wl_daily", 0) !== dk) { save("wl_daily", dk); }
fmtStats();
// 调试/测试钩子（不影响游戏逻辑）
window.__wl = {
  WORDS: WORDS, WSET: WSET, adjs: adjs,
  neighbors: neighbors, bfsDist: bfsDist, wordsAt: wordsAt, makePuzzle: makePuzzle,
  mulberry32: mulberry32, get G() { return G; }, get stats() { return stats; }
};
</script>
